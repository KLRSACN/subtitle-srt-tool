name: Batch transcribe Drive videos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/batch-transcribe-drive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transcription tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install faster-whisper opencc-python-reimplemented gdown

      - name: Download the three public Drive videos
        run: |
          mkdir -p input output
          gdown --id 1BVGJ9vygesqKB54OhVymE1WYCPoifY4S -O 'input/從角色、世界觀到分鏡！一套工作流完成整個故事宇宙.mp4'
          gdown --id 19SKmd-0_BN2YjSRs33abCyD4pZQaW1IA -O 'input/AI_自動字幕不夠準？KTV_字幕大師課：從生成到專業手動校正.mp4'
          gdown --id 1UEasGxExZNgewWmdXZi0tcdurSFBvgmf -O 'input/別再亂花錢！AI_影片生成模型性價比排行榜.mp4'
          ls -lh input

      - name: Generate Traditional Chinese SRT files
        run: |
          cat > /tmp/transcribe.py <<'PY'
          from pathlib import Path
          import re
          from faster_whisper import WhisperModel
          from opencc import OpenCC

          source = Path('input')
          output = Path('output')
          output.mkdir(exist_ok=True)
          cc = OpenCC('s2twp')

          prompts = {
              '從角色、世界觀到分鏡！一套工作流完成整個故事宇宙': '角色、世界觀、分鏡、故事宇宙、提示詞、角色一致性、Gemini、Flow、生成式 AI。',
              'AI_自動字幕不夠準？KTV_字幕大師課：從生成到專業手動校正': 'KTV 字幕、卡拉 OK、SRT、ASS、Aegisub、剪映、FFmpeg、Whisper、時間軸、逐字變色。',
              '別再亂花錢！AI_影片生成模型性價比排行榜': 'AI 影片生成模型、Veo、Sora、Runway、Kling、可靈、Hailuo、海螺、Seedance、Pika、Luma、性價比、訂閱制、點數。',
          }

          def stamp(value):
              ms = max(0, round(value * 1000))
              h, rem = divmod(ms, 3600000)
              m, rem = divmod(rem, 60000)
              s, ms = divmod(rem, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          def clean(text):
              text = cc.convert(text.strip())
              text = re.sub(r'\s+', ' ', text)
              text = re.sub(r'(?<=[\u3400-\u9fff])\s+(?=[\u3400-\u9fff，。！？；：、])', '', text)
              text = re.sub(r'(?<=[，。！？；：、])\s+(?=[\u3400-\u9fff])', '', text)
              return text.strip()

          def count(text):
              return len(text.replace(' ', ''))

          def wrap(text):
              if count(text) <= 22:
                  return text
              middle = len(text) // 2
              breaks = [i + 1 for i, ch in enumerate(text) if ch in '，。！？；：、' and 7 <= i <= len(text) - 7]
              cut = min(breaks, key=lambda i: abs(i - middle)) if breaks else middle
              return text[:cut].strip() + '\n' + text[cut:].strip()

          def cues_from(segments):
              cues = []
              punctuation = set('，。！？；：')
              for segment in segments:
                  words = list(segment.words or [])
                  if not words:
                      text = clean(segment.text)
                      if text:
                          cues.append([float(segment.start), float(segment.end), wrap(text)])
                      continue
                  parts, start, end = [], None, None
                  for word in words:
                      token = clean(word.word)
                      if not token:
                          continue
                      if start is None:
                          start = float(word.start if word.start is not None else segment.start)
                      end = float(word.end if word.end is not None else segment.end)
                      parts.append(token)
                      text = clean(''.join(parts))
                      if ((count(text) >= 18 and text[-1:] in punctuation) or count(text) >= 28 or end - start >= 6):
                          cues.append([start, max(end, start + .35), wrap(text)])
                          parts, start, end = [], None, None
                  if parts:
                      text = clean(''.join(parts))
                      cues.append([start, max(end, start + .35), wrap(text)])

              final = []
              for start, end, text in cues:
                  if final and text == final[-1][2]:
                      final[-1][1] = max(final[-1][1], end)
                      continue
                  if final and start < final[-1][1]:
                      boundary = max(final[-1][0] + .25, (final[-1][1] + start) / 2)
                      final[-1][1] = boundary
                      start = boundary
                  final.append([start, max(end, start + .35), text])
              return final

          print('Loading faster-whisper medium model...', flush=True)
          model = WhisperModel('medium', device='cpu', compute_type='int8', cpu_threads=4, num_workers=1)

          for video in sorted(source.glob('*.mp4')):
              print('Transcribing', video.name, flush=True)
              segments, info = model.transcribe(
                  str(video), language='zh', task='transcribe', beam_size=5, best_of=5,
                  temperature=0.0, condition_on_previous_text=True, word_timestamps=True,
                  vad_filter=True, vad_parameters={'min_silence_duration_ms': 400, 'speech_pad_ms': 200},
                  initial_prompt=video.stem + '。' + prompts.get(video.stem, ''),
                  hallucination_silence_threshold=2.0,
              )
              cues = cues_from(segments)
              destination = output / f'{video.stem}.srt'
              with destination.open('w', encoding='utf-8-sig', newline='\n') as handle:
                  for number, (start, end, text) in enumerate(cues, 1):
                      handle.write(f'{number}\n{stamp(start)} --> {stamp(end)}\n{text}\n\n')
              print(destination.name, len(cues), 'cues', flush=True)
          PY
          python /tmp/transcribe.py

      - name: Validate results
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path('output').glob('*.srt'))
          assert len(files) == 3, f'Expected 3 SRT files, got {len(files)}'
          timestamp = re.compile(r'\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}')
          for file in files:
              text = file.read_text(encoding='utf-8-sig')
              assert timestamp.search(text) and len(text) > 500, f'Invalid SRT: {file}'
              print(file.name, len(text), 'characters')
          PY

      - name: Upload subtitles
        uses: actions/upload-artifact@v4
        with:
          name: drive-srt-subtitles
          path: output/*.srt
          if-no-files-found: error
          retention-days: 7
