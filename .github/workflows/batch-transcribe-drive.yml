name: Batch transcribe Drive videos

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install faster-whisper opencc-python-reimplemented gdown

      - name: Download MP4 files from Google Drive
        run: |
          mkdir -p input output
          gdown --id '1BVGJ9vygesqKB54OhVymE1WYCPoifY4S' -O 'input/從角色、世界觀到分鏡！一套工作流完成整個故事宇宙.mp4'
          gdown --id '19SKmd-0_BN2YjSRs33abCyD4pZQaW1IA' -O 'input/AI_自動字幕不夠準？KTV_字幕大師課：從生成到專業手動校正.mp4'
          gdown --id '1UEasGxExZNgewWmdXZi0tcdurSFBvgmf' -O 'input/別再亂花錢！AI_影片生成模型性價比排行榜.mp4'
          ls -lh input

      - name: Transcribe to Traditional Chinese SRT
        run: |
          cat > /tmp/transcribe.py <<'PY'
          from pathlib import Path
          import re
          from faster_whisper import WhisperModel
          from opencc import OpenCC

          INPUT = Path('input')
          OUTPUT = Path('output')
          OUTPUT.mkdir(exist_ok=True)
          cc = OpenCC('s2twp')

          prompts = {
              '從角色、世界觀到分鏡！一套工作流完成整個故事宇宙':
                  '從角色、世界觀到分鏡，一套工作流完成整個故事宇宙。角色設定、世界觀、分鏡、故事宇宙、提示詞、角色一致性、Gemini、Flow、生成式 AI。',
              'AI_自動字幕不夠準？KTV_字幕大師課：從生成到專業手動校正':
                  'AI 自動字幕不夠準？KTV 字幕大師課，從生成到專業手動校正。SRT、ASS、Aegisub、剪映、FFmpeg、Whisper、卡拉 OK、KTV 字幕、時間軸、逐字變色。',
              '別再亂花錢！AI_影片生成模型性價比排行榜':
                  '別再亂花錢！AI 影片生成模型性價比排行榜。Veo、Sora、Runway、Kling、可靈、Hailuo、海螺、Seedance、Pika、Luma、生成式 AI、性價比、訂閱制、點數。',
          }

          def ts(seconds: float) -> str:
              ms = max(0, round(seconds * 1000))
              h, rem = divmod(ms, 3_600_000)
              m, rem = divmod(rem, 60_000)
              s, ms = divmod(rem, 1000)
              return f'{h:02d}:{m:02d}:{s:02d},{ms:03d}'

          def normalize(text: str) -> str:
              text = cc.convert(text.strip())
              text = re.sub(r'\s+', ' ', text)
              # Remove spaces between CJK characters while retaining useful English spacing.
              text = re.sub(r'(?<=[\u3400-\u9fff])\s+(?=[\u3400-\u9fff])', '', text)
              text = re.sub(r'(?<=[\u3400-\u9fff])\s+(?=[，。！？；：、])', '', text)
              text = re.sub(r'(?<=[，。！？；：、])\s+(?=[\u3400-\u9fff])', '', text)
              return text.strip()

          def char_len(text: str) -> int:
              return len(text.replace(' ', ''))

          def wrap_two_lines(text: str, limit: int = 22) -> str:
              if char_len(text) <= limit:
                  return text
              target = len(text) // 2
              candidates = [i + 1 for i, ch in enumerate(text) if ch in '，。！？；：、' and 7 <= i <= len(text) - 7]
              cut = min(candidates, key=lambda i: abs(i - target)) if candidates else target
              return text[:cut].strip() + '\n' + text[cut:].strip()

          def build_cues(segments):
              cues = []
              punctuation = set('，。！？；：')
              for seg in segments:
                  words = list(seg.words or [])
                  if not words:
                      text = normalize(seg.text)
                      if text:
                          cues.append((float(seg.start), float(seg.end), wrap_two_lines(text)))
                      continue

                  group = []
                  start = None
                  end = None
                  for word in words:
                      token = normalize(word.word)
                      if not token:
                          continue
                      if start is None:
                          start = float(word.start if word.start is not None else seg.start)
                      end = float(word.end if word.end is not None else seg.end)
                      group.append(token)
                      text = normalize(''.join(group))
                      duration = end - start
                      should_break = (
                          (char_len(text) >= 18 and text[-1:] in punctuation)
                          or char_len(text) >= 28
                          or duration >= 6.0
                      )
                      if should_break:
                          cues.append((start, max(end, start + 0.35), wrap_two_lines(text)))
                          group, start, end = [], None, None
                  if group and start is not None and end is not None:
                      text = normalize(''.join(group))
                      cues.append((start, max(end, start + 0.35), wrap_two_lines(text)))

              # Resolve accidental overlaps and remove exact consecutive duplicates.
              cleaned = []
              for start, end, text in cues:
                  if not text:
                      continue
                  if cleaned and text == cleaned[-1][2]:
                      cleaned[-1] = (cleaned[-1][0], max(cleaned[-1][1], end), text)
                      continue
                  if cleaned and start < cleaned[-1][1]:
                      prev_start, prev_end, prev_text = cleaned[-1]
                      boundary = max(prev_start + 0.25, (prev_end + start) / 2)
                      cleaned[-1] = (prev_start, boundary, prev_text)
                      start = boundary
                  cleaned.append((start, max(end, start + 0.35), text))
              return cleaned

          print('Loading faster-whisper medium model...')
          model = WhisperModel('medium', device='cpu', compute_type='int8', cpu_threads=4, num_workers=1)

          for video in sorted(INPUT.glob('*.mp4')):
              print(f'Transcribing: {video.name}', flush=True)
              segments, info = model.transcribe(
                  str(video),
                  language='zh',
                  task='transcribe',
                  beam_size=5,
                  best_of=5,
                  temperature=0.0,
                  vad_filter=True,
                  vad_parameters={'min_silence_duration_ms': 400, 'speech_pad_ms': 200},
                  condition_on_previous_text=True,
                  word_timestamps=True,
                  initial_prompt=prompts.get(video.stem, video.stem),
                  hallucination_silence_threshold=2.0,
              )
              cues = build_cues(segments)
              out = OUTPUT / f'{video.stem}.srt'
              with out.open('w', encoding='utf-8-sig', newline='\n') as f:
                  for index, (start, end, text) in enumerate(cues, 1):
                      f.write(f'{index}\n{ts(start)} --> {ts(end)}\n{text}\n\n')
              print(f'Created {out} with {len(cues)} cues; detected={info.language}', flush=True)
          PY
          python /tmp/transcribe.py
          ls -lh output

      - name: Validate generated SRT files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path('output').glob('*.srt'))
          assert len(files) == 3, f'Expected 3 SRT files, got {len(files)}'
          pattern = re.compile(r'\d{2}:\d{2}:\d{2},\d{3} --> \d{2}:\d{2}:\d{2},\d{3}')
          for path in files:
              text = path.read_text(encoding='utf-8-sig')
              assert pattern.search(text), f'No valid timestamps in {path}'
              assert len(text) > 500, f'SRT appears too small: {path}'
              print(path.name, len(text), 'characters')
          PY

      - name: Upload SRT artifact
        uses: actions/upload-artifact@v4
        with:
          name: drive-srt-subtitles
          path: output/*.srt
          if-no-files-found: error
          retention-days: 7
